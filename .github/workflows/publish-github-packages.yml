name: Publish CLI to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@souravrajvi0'

      - name: Install CLI dependencies
        run: npm install -w @openinference/cli --no-audit --no-fund

      - name: Build CLI
        run: npm run build -w @openinference/cli

      # GitHub Packages requires the npm scope to match the repository owner.
      - name: Rename package for GitHub Packages
        working-directory: packages/cli
        run: npm pkg set name=@souravrajvi0/cli publishConfig.registry=https://npm.pkg.github.com

      - name: Publish
        working-directory: packages/cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
